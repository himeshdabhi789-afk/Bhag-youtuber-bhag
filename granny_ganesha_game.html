<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D MULTIPLAYER - JOYSTICK & FREE SCREEN LOOK</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        * { user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #111; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        input, button {
            padding: 12px; margin: 8px; font-size: 16px; border-radius: 8px; border: none;
        }
        input { width: 250px; text-align: center; }
        button { background: #ff0000; color: white; font-weight: bold; cursor: pointer; }

        #ui {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            color: #ffd700; font-size: 15px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; pointer-events: none;
        }

        /* 3D જોયસ્ટિક એરિયા */
        #joystickZone {
            position: absolute; bottom: 20px; left: 20px;
            width: 120px; height: 120px; z-index: 20;
        }
    </style>
</head>
<body>

<div id="lobby">
    <h2 style="color: #ffd700; margin-bottom: 15px;">🕉️ 3D મલ્ટીપ્લેયર ગણેશ હોરર 🕉️</h2>
    <input type="text" id="playerName" placeholder="તમારું ID Name">
    <input type="text" id="targetPeerId" placeholder="સામેવાળા મિત્રનું ID">
    
    <button onclick="startHost()">૧. નવો રૂમ બનાવો (Host)</button>
    <button onclick="connectPeer()">૨. મિત્રના ID માં જોડાઓ (Join)</button>
    <p id="myIdText" style="margin-top: 15px; color: #00ff00;"></p>
</div>

<div id="ui">
    🔑 ચાવીઓ: <span id="keyCount">0</span> / 20 | ⏱️ સમય: <span id="timer">20:00</span>
    <br><span id="status" style="color:#00ff00;"></span>
</div>

<!-- જોયસ્ટિક કંટ્રોલ એરિયા -->
<div id="joystickZone"></div>

<script>
let peer, conn;
let myPlayerName = "";
let isHost = false;

function initPeer() {
    myPlayerName = document.getElementById("playerName").value || "Player_" + Math.floor(Math.random()*1000);
    peer = new Peer(myPlayerName);
    peer.on('open', (id) => {
        document.getElementById("myIdText").innerText = "તમારું ID: " + id;
    });
    peer.on('connection', (c) => {
        conn = c;
        setupConnection();
    });
}

function startHost() {
    isHost = true;
    initPeer();
    document.getElementById("lobby").style.display = "none";
    init3DGame();
}

function connectPeer() {
    isHost = false;
    initPeer();
    let target = document.getElementById("targetPeerId").value;
    setTimeout(() => {
        conn = peer.connect(target);
        setupConnection();
        document.getElementById("lobby").style.display = "none";
        init3DGame();
    }, 1000);
}

function setupConnection() {
    document.getElementById("status").innerText = "Connected!";
    conn.on('data', (data) => {
        if (otherPlayerMesh) {
            otherPlayerMesh.position.set(data.x, data.y, data.z);
        }
    });
}

// --- THREE.JS 3D ENGINE ---
let scene, camera, renderer;
let myPlayerMesh, otherPlayerMesh;
let moveVector = { x: 0, y: 0 };

// કેમેરા ફ્રી-લુક વેરીએબલ્સ
let isDragging = false;
let previousTouch = { x: 0, y: 0 };
let cameraAngleX = 0;
let cameraAngleY = 0.3;

function init3DGame() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x404040));

    // જમીન
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // માટીના ગણેશજીનો સેફ રૂમ
    const roomGeo = new THREE.BoxGeometry(10, 5, 10);
    const roomMat = new THREE.MeshStandardMaterial({ color: 0xffa500, transparent: true, opacity: 0.4 });
    const safeZone = new THREE.Mesh(roomGeo, roomMat);
    safeZone.position.set(15, 2.5, 15);
    scene.add(safeZone);

    // 3D પ્લેયર ૧
    const p1Geo = new THREE.BoxGeometry(1, 1.5, 1);
    const p1Mat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    myPlayerMesh = new THREE.Mesh(p1Geo, p1Mat);
    myPlayerMesh.position.set(0, 0.75, 0);
    myPlayerMesh.castShadow = true;
    scene.add(myPlayerMesh);

    // 3D પ્લેયર ૨
    const p2Geo = new THREE.BoxGeometry(1, 1.5, 1);
    const p2Mat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
    otherPlayerMesh = new THREE.Mesh(p2Geo, p2Mat);
    otherPlayerMesh.position.set(2, 0.75, 0);
    otherPlayerMesh.castShadow = true;
    scene.add(otherPlayerMesh);

    setupJoystick();
    setupFreeLookControls();
    animate();
}

// 1. ફ્રી-લુક ટચ કંટ્રોલ્સ (Free Screen Rotation)
function setupFreeLookControls() {
    window.addEventListener('touchstart', (e) => {
        if (e.touches[0].clientX > window.innerWidth / 2) {
            isDragging = true;
            previousTouch.x = e.touches[0].clientX;
            previousTouch.y = e.touches[0].clientY;
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let touch = e.touches[0];
        let deltaX = touch.clientX - previousTouch.x;
        let deltaY = touch.clientY - previousTouch.y;

        cameraAngleX -= deltaX * 0.005;
        cameraAngleY += deltaY * 0.005;

        // કેમેરા લિમિટ
        cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.5, cameraAngleY));

        previousTouch.x = touch.clientX;
        previousTouch.y = touch.clientY;
    });

    window.addEventListener('touchend', () => { isDragging = false; });
}

// 2. NippleJS 3D જોયસ્ટિક
function setupJoystick() {
    const joystick = nipplejs.create({
        zone: document.getElementById('joystickZone'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white',
        size: 100
    });

    joystick.on('move', (evt, data) => {
        if (data.vector) {
            moveVector.x = data.vector.x;
            moveVector.y = data.vector.y;
        }
    });

    joystick.on('end', () => {
        moveVector.x = 0;
        moveVector.y = 0;
    });
}

function animate() {
    requestAnimationFrame(animate);

    // જોયસ્ટિક મુવમેન્ટ logic
    let speed = 0.12;
    if (moveVector.x !== 0 || moveVector.y !== 0) {
        myPlayerMesh.position.x += moveVector.x * speed;
        myPlayerMesh.position.z -= moveVector.y * speed;
    }

    // ફ્રી કેમેરા પોઝિશન અપડેટ (Orbit view around Player)
    let camDistance = 10;
    camera.position.x = myPlayerMesh.position.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
    camera.position.y = myPlayerMesh.position.y + camDistance * Math.sin(cameraAngleY);
    camera.position.z = myPlayerMesh.position.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
    camera.lookAt(myPlayerMesh.position);

    // ડેટા સિંક
    if (conn && conn.open) {
        conn.send({
            x: myPlayerMesh.position.x,
            y: myPlayerMesh.position.y,
            z: myPlayerMesh.position.z
        });
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
