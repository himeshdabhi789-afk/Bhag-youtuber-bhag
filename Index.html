<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Surfer Runner Game</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0c10;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      touch-action: manipulation;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    #hud {
      display: flex;
      gap: 25px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #66fcf1;
    }

    #track {
      position: relative;
      width: 270px;
      height: 340px;
      background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
      border: 3px solid #45a29e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
    }

    .lane {
      flex: 1;
      border-right: 1px dashed #45a29e;
    }

    .lane:last-child {
      border-right: none;
    }

    .char {
      position: absolute;
      font-size: 36px;
      transition: left 0.12s, transform 0.15s;
    }

    #player {
      bottom: 20px;
      left: 112px;
      z-index: 10;
    }

    #guard {
      bottom: -40px;
      left: 112px;
      opacity: 0;
      transition: bottom 0.3s, left 0.12s, opacity 0.3s;
      z-index: 9;
    }

    .item {
      position: absolute;
      font-size: 26px;
      top: -40px;
    }

    .jump { transform: translateY(-50px) scale(1.2); }
    .slide { transform: scaleY(0.5); }

    #plane-selector {
      margin: 10px 0;
    }

    #plane-selector button {
      background: #1f2833;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 6px 12px;
      border-radius: 6px;
      margin: 2px;
      font-weight: bold;
      cursor: pointer;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
