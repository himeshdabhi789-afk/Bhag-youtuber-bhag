<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Edition - Custom ID Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; background-color: #0f0f0f; }
        
        #ui { position: absolute; top: 12px; left: 12px; color: #fff; font-size: 16px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.85); padding: 12px 18px; border-radius: 10px; border: 2px solid #ff0000; box-shadow: 0 4px 12px rgba(255,0,0,0.4); }
        
        #lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #181818; color: #fff; padding: 25px; border-radius: 14px; text-align: center; z-index: 30; box-shadow: 0 0 20px rgba(255,0,0,0.5); width: 330px; border: 2px solid #ff0000; }
        #lobby h2 { margin-top: 0; color: #ff0000; font-size: 24px; text-transform: uppercase; }
        #lobby input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #222; color: #fff; border-radius: 8px; font-size: 15px; text-align: center; outline: none; }
        #lobby button { width: 95%; padding: 12px; margin: 8px 0; background: #ff0000; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #lobby button:hover { background: #cc0000; transform: scale(1.02); }

        #gameover { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 32px; text-align: center; font-weight: bold; z-index: 20; background: rgba(0, 0, 0, 0.95); padding: 25px 35px; border-radius: 14px; border: 3px solid #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.7); }
        #restartBtn { display: block; margin: 15px auto 0 auto; padding: 12px 30px; font-size: 18px; font-weight: bold; color: #fff; background: #ff0000; border: none; border-radius: 8px; cursor: pointer; }

        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        .btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.9); border: 3px solid #ff0000; border-radius: 50%; font-size: 26px; font-weight: bold; color: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:active { background: #ff0000; color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- Lobby UI -->
    <div id="lobby">
        <h2>▶️ YouTube Multiplayer</h2>
        <input type="text" id="usernameInput" placeholder="તમારું નામ લખો..." value="YouTuber Gamer">
        
        <!-- તમારી બિલ્ટ-ઇન ID સેટ કરેલી છે -->
        <input type="text" id="myCustomId" placeholder="તમારી રૂમ ID" value="MY-YT-GAME-1001">

        <button id="hostBtn">🏠 મારી ID થી રૂમ બનાવો</button>
        
        <hr style="margin: 15px 0; border: 0.5px solid #333;">
        <p style="margin: 5px; font-size: 13px; color: #aaa;">મિત્રની ID નાખીને તેની સાથે જોડાઓ:</p>
        <input type="text" id="joinCodeInput" placeholder="મિત્રની ID (Friend ID)" value="MY-YT-GAME-1001">
        <button id="joinBtn" style="background: #28a745;">🔗 ફ્રેન્ડની ID માં જોડાઓ</button>
        <p id="statusMsg" style="color: #ffaa00; font-size: 13px; margin-top: 10px;"></p>
    </div>

    <!-- Gameplay Overlay -->
    <div id="ui">
        🎬 Creator: <span id="ytName" style="color:#ff0000;">તમે</span><br>
        🆔 Room ID: <span id="roomCodeDisplay" style="color:#00ffcc;">-</span><br>
        ⭐ Score: <span id="score" style="color:#ffaa00;">0</span>
    </div>
    
    <div id="gameover">
        GAME OVER!
        <button id="restartBtn">Play Again 🔄</button>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="jumpBtn">⬆️</div>
        <div class="btn" id="slideBtn">⬇️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <script>
        let scene, camera, renderer, player, friendPlayer, obstacles = [], decorations = [], score = 0, isGameOver = false;
        let lanes = [-2.2, 0, 2.2];
        let currentLane = 1;

        let isJumping = false, jumpVelocity = 0, gravity = -0.018;
        let isSliding = false, slideTimer = 0;

        let peer = null, conn = null, isHost = false;

        document.getElementById('hostBtn').addEventListener('click', hostGame);
        document.getElementById('joinBtn').addEventListener('click', joinGame);

        function hostGame() {
            const name = document.getElementById('usernameInput').value || "YouTuber";
            const customId = document.getElementById('myCustomId').value.trim();
            document.getElementById('ytName').innerText = name;
            document.getElementById('statusMsg').innerText = "તમારી ID થી સર્વર કનેક્ટ થઈ રહ્યું છે...";

            // તમારી મનપસંદ કસ્ટમ ID સાથે Peer ચાલુ થશે
            peer = new Peer(customId);
            
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('roomCodeDisplay').innerText = id;
                alert("તમારો રૂમ ચાલુ થઈ ગયો છે!\nતમારી ID: " + id + "\nઆ ID તમારા ભાઈબંધને આપો!");
                document.getElementById('lobby').style.display = 'none';
                initGame();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("આ ID પહેલેથી જ કોઈ વાપરી રહ્યું છે! મહેરબાની કરીને થોડો ફેરફાર કરો.");
                } else {
                    alert("કનેક્શનમાં ભૂલ આવી: " + err.type);
                }
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function joinGame() {
            const name = document.getElementById('usernameInput').value || "Guest Creator";
            const friendId = document.getElementById('joinCodeInput').value.trim();
            if (!friendId) { alert("મહેરબાની કરીને ફ્રેન્ડની ID નાખો!"); return; }

            document.getElementById('ytName').innerText = name;
            document.getElementById('statusMsg').innerText = "ફ્રેન્ડની ID સાથે જોડાઈ રહ્યા છીએ...";

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(friendId);
                setupConnection();
                document.getElementById('roomCodeDisplay').innerText = friendId;
                document.getElementById('lobby').style.display = 'none';
                initGame();
            });
        }

        function setupConnection() {
            conn.on('open', () => { createFriendPlayer(); });
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    if (!friendPlayer) createFriendPlayer();
                    friendPlayer.position.x = data.x;
                    friendPlayer.position.y = data.y;
                    friendPlayer.position.z = data.z;
                }
            });
        }

        function sendPosition() {
            if (conn && conn.open && player) {
                conn.send({ type: 'move', x: player.position.x, y: player.position.y, z: player.position.z });
            }
        }

        function createPlayerMesh(colorHex) {
            const group = new THREE.Group();
            
            // Player Body
            const bodyGeo = new THREE.BoxGeometry(0.9, 1.3, 0.4);
            const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // Play Icon Triangle
            const playGeo = new THREE.ConeGeometry(0.3, 0.4, 3);
            const playMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const playIcon = new THREE.Mesh(playGeo, playMat);
            playIcon.rotation.z = -Math.PI / 2;
            playIcon.position.set(0, 0.1, 0.22);
            group.add(playIcon);

            return group;
        }

        function createFriendPlayer() {
            if (!friendPlayer && scene) {
                friendPlayer = createPlayerMesh(0x00d2ff); // Diamond Blue for Friend
                friendPlayer.position.set(lanes[1], 0.7, 0);
                scene.add(friendPlayer);
            }
        }

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111115);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, 7);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
            sunLight.position.set(10, 20, 10);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(150, 200), new THREE.MeshLambertMaterial({ color: 0x0a0a0c }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 200), new THREE.MeshLambertMaterial({ color: 0x1f1f24 }));
            road.rotation.x = -Math.PI / 2;
            road.position.z = -80;
            scene.add(road);

            // Red Main Player
            player = createPlayerMesh(0xff0000);
            player.position.set(lanes[currentLane], 0.7, 0);
            scene.add(player);

            window.addEventListener('keydown', handleInput);
            window.addEventListener('resize', onWindowResize);

            document.getElementById('leftBtn').addEventListener('pointerdown', moveLeft);
            document.getElementById('rightBtn').addEventListener('pointerdown', moveRight);
            document.getElementById('jumpBtn').addEventListener('pointerdown', jump);
            document.getElementById('slideBtn').addEventListener('pointerdown', slide);
            document.getElementById('restartBtn').addEventListener('click', restartGame);

            setInterval(spawnObstacle, 1500);
            setInterval(spawnYTStudioDecorations, 700);

            animate();
        }

        function spawnYTStudioDecorations() {
            if (isGameOver) return;
            const side = Math.random() > 0.5 ? 8 : -8;
            
            if (Math.random() > 0.4) {
                const height = 4 + Math.random() * 5;
                const bGeo = new THREE.BoxGeometry(3, height, 4);
                const bMat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x220000 : 0x111122 });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(side > 0 ? side + 1.5 : side - 1.5, height / 2, -70);
                scene.add(building);
                decorations.push(building);
            }
        }

        function spawnObstacle() {
            if (isGameOver) return;
            const lane = lanes[Math.floor(Math.random() * 3)];
            const randType = Math.random();
            let mesh, type, minY, maxY;

            if (randType < 0.35) {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0xffaa00 }));
                mesh.position.set(lane, 1.4, -70);
                minY = 0.8; maxY = 2.0; type = 'slide';
            } else if (randType < 0.7) {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.3, 6), new THREE.MeshLambertMaterial({ color: 0x990000 }));
                mesh.position.set(lane, 0.65, -70);
                minY = 0; maxY = 1.3; type = 'train';
            } else {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 3), new THREE.MeshLambertMaterial({ color: 0x000000 }));
                mesh.position.set(lane, 0.05, -70);
                minY = -0.5; maxY = 0.3; type = 'pit';
            }
            scene.add(mesh);
            obstacles.push({ mesh, type, minY, maxY });
        }

        function moveLeft() { if (!isGameOver && currentLane > 0) currentLane--; }
        function moveRight() { if (!isGameOver && currentLane < 2) currentLane++; }

        function jump() {
            if (!isGameOver && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.38;
            }
        }

        function slide() {
            if (!isGameOver && !isSliding && !isJumping) {
                isSliding = true;
                slideTimer = 35;
                player.scale.set(1, 0.4, 1);
                player.position.y = 0.28;
            }
        }

        function handleInput(e) {
            if (isGameOver && e.code === 'Space') restartGame();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp') jump();
            if (e.key === 'ArrowDown') slide();
        }

        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);

                player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 0.7) {
                        player.position.y = 0.7;
                        isJumping = false;
                    }
                }

                if (isSliding) {
                    slideTimer--;
                    if (slideTimer <= 0) {
                        player.scale.set(1, 1, 1);
                        player.position.y = 0.7;
                        isSliding = false;
                    }
                }

                sendPosition();

                for (let i = decorations.length - 1; i >= 0; i--) {
                    decorations[i].position.z += 0.55;
                    if (decorations[i].position.z > 15) {
                        scene.remove(decorations[i]);
                        decorations.splice(i, 1);
                    }
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obj = obstacles[i];
                    obj.mesh.position.z += 0.55;

                    let pZ = player.position.z, pX = player.position.x;
                    let pY_top = isSliding ? 0.56 : (player.position.y + 0.7);
                    let pY_bottom = isSliding ? 0.0 : (player.position.y - 0.7);

                    if (Math.abs(obj.mesh.position.z - pZ) < 1.2 && Math.abs(obj.mesh.position.x - pX) < 0.8) {
                        if (obj.type === 'pit') {
                            if (player.position.y < 1.2) endGame();
                        } else {
                            if (pY_top > obj.minY && pY_bottom < obj.maxY) endGame();
                        }
                    }

                    if (obj.mesh.position.z > 15) {
                        scene.remove(obj.mesh);
                        obstacles.splice(i, 1);
                        score += 50;
                        document.getElementById('score').innerText = score;
                    }
                }

                renderer.render(scene, camera);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('gameover').style.display = 'block';
        }

        function restartGame() {
            obstacles.forEach(o => scene.remove(o.mesh));
            decorations.forEach(d => scene.remove(d));
            obstacles = [];
            decorations = [];
            score = 0;
            currentLane = 1;
            player.position.set(lanes[currentLane], 0.7, 0);
            player.scale.set(1, 1, 1);
            document.getElementById('score').innerText = score;
            document.getElementById('gameover').style.display = 'none';
            isGameOver = false;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
