<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Subway Surfers - Ultimate Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background-color: #87CEEB; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: #111; font-size: 16px; font-weight: bold; z-index: 10; background: rgba(255,255,255,0.9); padding: 10px 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        
        #lobby { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 25px; border-radius: 12px; text-align: center; z-index: 30; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 320px; }
        #lobby h2 { margin-top: 0; color: #ff0055; }
        #lobby input, #lobby select { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; text-align: center; }
        #lobby button { width: 95%; padding: 10px; margin: 6px 0; background: #0055FF; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #lobby button:hover { background: #0044cc; }

        #gameover { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; font-size: 32px; text-align: center; font-weight: bold; z-index: 20; background: rgba(255, 255, 255, 0.95); padding: 20px 30px; border-radius: 12px; border: 3px solid #ff0055; }
        #restartBtn { display: block; margin: 15px auto 0 auto; padding: 10px 25px; font-size: 18px; font-weight: bold; color: #fff; background: #ff0055; border: none; border-radius: 8px; cursor: pointer; }

        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        .btn { width: 65px; height: 65px; background: rgba(255, 255, 255, 0.85); border: 3px solid #111; border-radius: 50%; font-size: 26px; font-weight: bold; color: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(0, 0, 0, 0.4); color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- Lobby & Friend ID Selection -->
    <div id="lobby">
        <h2>🎬 YouTube 3D Runner</h2>
        <input type="text" id="usernameInput" placeholder="તમારું YouTube નામ..." value="YouTuber Gamer">
        
        <hr style="margin: 12px 0; border: 0.5px solid #ddd;">
        <button id="hostBtn">🏠 રૂમ બનાવો (Host)</button>
        
        <p style="margin: 8px; font-size: 13px; color: #666;">অথવા ફ્રેન્ડની ID થી જોડાઓ:</p>
        <input type="text" id="joinCodeInput" placeholder="મિત્રનો રૂમ કોડ (Friend ID)">
        <button id="joinBtn" style="background: #28a745;">🔗 ફ્રેન્ડ સાથે જોડાઓ (Join)</button>
        <p id="statusMsg" style="color: #ff5500; font-size: 12px; margin-top: 8px;"></p>
    </div>

    <!-- UI Overlay -->
    <div id="ui">
        📹 Channel: <span id="ytName">તમે</span><br>
        👥 Room ID: <span id="roomCodeDisplay">-</span><br>
        ⭐ Score: <span id="score">0</span>
    </div>
    
    <div id="gameover">
        GAME OVER!
        <button id="restartBtn">Restart Game 🔄</button>
    </div>

    <!-- Game Controls -->
    <div class="controls">
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="jumpBtn">⬆️</div>
        <div class="btn" id="slideBtn">⬇️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <script>
        let scene, camera, renderer, player, friendPlayer, obstacles = [], decorations = [], score = 0, isGameOver = false;
        let lanes = [-2.2, 0, 2.2];
        let currentLane = 1;

        let isJumping = false, jumpVelocity = 0, gravity = -0.018;
        let isSliding = false, slideTimer = 0;

        let peer = null, conn = null, isHost = false;

        document.getElementById('hostBtn').addEventListener('click', hostGame);
        document.getElementById('joinBtn').addEventListener('click', joinGame);

        function hostGame() {
            const name = document.getElementById('usernameInput').value || "Host";
            document.getElementById('ytName').innerText = name;
            document.getElementById('statusMsg').innerText = "રૂમ સેટ થઈ રહ્યો છે...";

            peer = new Peer();
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('roomCodeDisplay').innerText = id;
                document.getElementById('statusMsg').innerText = "રૂમ બની ગયો! મિત્રને આ ID આપો.";
                alert("તમારો રૂમ કોડ (ID): " + id + "\nઆ કોડ તમારા ફ્રેન્ડને મોકલો!");
                document.getElementById('lobby').style.display = 'none';
                initGame();
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        function joinGame() {
            const name = document.getElementById('usernameInput').value || "Friend";
            const hostId = document.getElementById('joinCodeInput').value.trim();
            if (!hostId) { alert("મહેરબાની કરીને ફ્રેન્ડની રૂમ ID નાખો!"); return; }

            document.getElementById('ytName').innerText = name;
            document.getElementById('statusMsg').innerText = "કનેક્ટ થઈ રહ્યું છે...";

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                setupConnection();
                document.getElementById('roomCodeDisplay').innerText = hostId;
                document.getElementById('lobby').style.display = 'none';
                initGame();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                createFriendPlayer();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    if (!friendPlayer) createFriendPlayer();
                    friendPlayer.position.x = data.x;
                    friendPlayer.position.y = data.y;
                    friendPlayer.position.z = data.z;
                }
            });
        }

        function sendPosition() {
            if (conn && conn.open && player) {
                conn.send({
                    type: 'move',
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z
                });
            }
        }

        function createFriendPlayer() {
            if (!friendPlayer && scene) {
                const geo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
                const mat = new THREE.MeshLambertMaterial({ color: 0xFFD700 }); // Golden color for Friend
                friendPlayer = new THREE.Mesh(geo, mat);
                friendPlayer.position.set(lanes[1], 0.7, 0);
                scene.add(friendPlayer);
            }
        }

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.8, 7);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(10, 20, 10);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Ground & Road
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(150, 200), new THREE.MeshLambertMaterial({ color: 0x3a9d23 }));
            grass.rotation.x = -Math.PI / 2;
            scene.add(grass);

            const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 200), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            road.rotation.x = -Math.PI / 2;
            road.position.z = -80;
            scene.add(road);

            // My Player (Blue)
            const playerGeo = new THREE.BoxGeometry(0.8, 1.4, 0.8);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x0055FF });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(lanes[currentLane], 0.7, 0);
            scene.add(player);

            window.addEventListener('keydown', handleInput);
            window.addEventListener('resize', onWindowResize);

            document.getElementById('leftBtn').addEventListener('pointerdown', moveLeft);
            document.getElementById('rightBtn').addEventListener('pointerdown', moveRight);
            document.getElementById('jumpBtn').addEventListener('pointerdown', jump);
            document.getElementById('slideBtn').addEventListener('pointerdown', slide);
            document.getElementById('restartBtn').addEventListener('click', restartGame);

            setInterval(spawnObstacle, 1600);
            setInterval(spawnBuildingOrTree, 800);

            animate();
        }

        // Spawn Obstacles: Trains, Barriers, or Pits (ખાડા)
        function spawnObstacle() {
            if (isGameOver) return;
            const lane = lanes[Math.floor(Math.random() * 3)];
            const randType = Math.random();
            let mesh, type, minY, maxY;

            if (randType < 0.35) {
                // High Barrier (Slide under)
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 0.5), new THREE.MeshLambertMaterial({ color: 0xffaa00 }));
                mesh.position.set(lane, 1.4, -70);
                minY = 0.8; maxY = 2.0; type = 'slide';
            } else if (randType < 0.7) {
                // Train (Jump or switch lane)
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 6), new THREE.MeshLambertMaterial({ color: 0xCC0000 }));
                mesh.position.set(lane, 0.6, -70);
                minY = 0; maxY = 1.2; type = 'train';
            } else {
                // Pit / Hole in ground (Jump over)
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 3), new THREE.MeshLambertMaterial({ color: 0x111111 }));
                mesh.position.set(lane, 0.05, -70);
                minY = -0.5; maxY = 0.3; type = 'pit';
            }
            scene.add(mesh);
            obstacles.push({ mesh, type, minY, maxY });
        }

        // Spawn City Buildings & Houses (Square/Houses decoration)
        function spawnBuildingOrTree() {
            if (isGameOver) return;
            const side = Math.random() > 0.5 ? 8 : -8;
            
            if (Math.random() > 0.4) {
                // House / Square Building
                const width = 3 + Math.random() * 2;
                const height = 4 + Math.random() * 4;
                const buildingGeo = new THREE.BoxGeometry(width, height, 4);
                const buildingMat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x8888aa : 0xcc6666 });
                const building = new THREE.Mesh(buildingGeo, buildingMat);
                building.position.set(side > 0 ? side + 1.5 : side - 1.5, height / 2, -70);
                scene.add(building);
                decorations.push(building);
            } else {
                // Tree
                const tree = new THREE.Group();
                tree.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2), new THREE.MeshLambertMaterial({ color: 0x8B4513 })));
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.5, 6), new THREE.MeshLambertMaterial({ color: 0x228B22 }));
                leaves.position.y = 2.5;
                tree.add(leaves);
                tree.position.set(side, 0, -70);
                scene.add(tree);
                decorations.push(tree);
            }
        }

        function moveLeft() { if (!isGameOver && currentLane > 0) currentLane--; }
        function moveRight() { if (!isGameOver && currentLane < 2) currentLane++; }

        function jump() {
            if (!isGameOver && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.38;
            }
        }

        function slide() {
            if (!isGameOver && !isSliding && !isJumping) {
                isSliding = true;
                slideTimer = 35;
                player.scale.set(1, 0.4, 1);
                player.position.y = 0.28;
            }
        }

        function handleInput(e) {
            if (isGameOver && e.code === 'Space') restartGame();
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp') jump();
            if (e.key === 'ArrowDown') slide();
        }

        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);

                player.position.x += (lanes[currentLane] - player.position.x) * 0.2;

                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 0.7) {
                        player.position.y = 0.7;
                        isJumping = false;
                    }
                }

                if (isSliding) {
                    slideTimer--;
                    if (slideTimer <= 0) {
                        player.scale.set(1, 1, 1);
                        player.position.y = 0.7;
                        isSliding = false;
                    }
                }

                sendPosition();

                // Move Decorations (Buildings/Trees)
                for (let i = decorations.length - 1; i >= 0; i--) {
                    decorations[i].position.z += 0.5;
                    if (decorations[i].position.z > 15) {
                        scene.remove(decorations[i]);
                        decorations.splice(i, 1);
                    }
                }

                // Move & Check Obstacles (Trains, Barriers, Pits)
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obj = obstacles[i];
                    obj.mesh.position.z += 0.5;

                    let pZ = player.position.z, pX = player.position.x;
                    let pY_top = isSliding ? 0.56 : (player.position.y + 0.7);
                    let pY_bottom = isSliding ? 0.0 : (player.position.y - 0.7);

                    if (Math.abs(obj.mesh.position.z - pZ) < 1.2 && Math.abs(obj.mesh.position.x - pX) < 0.8) {
                        if (obj.type === 'pit') {
                            // If it's a pit and player is not jumping high enough, game over
                            if (player.position.y < 1.2) {
                                endGame();
                            }
                        } else {
                            if (pY_top > obj.minY && pY_bottom < obj.maxY) {
                                endGame();
                            }
                        }
                    }

                    if (obj.mesh.position.z > 15) {
                        scene.remove(obj.mesh);
                        obstacles.splice(i, 1);
                        score += 25;
                        document.getElementById('score').innerText = score;
                    }
                }

                renderer.render(scene, camera);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('gameover').style.display = 'block';
        }

        function restartGame() {
            obstacles.forEach(o => scene.remove(o.mesh));
            decorations.forEach(d => scene.remove(d));
            obstacles = [];
            decorations = [];
            score = 0;
            currentLane = 1;
            player.position.set(lanes[currentLane], 0.7, 0);
            player.scale.set(1, 1, 1);
            document.getElementById('score').innerText = score;
            document.getElementById('gameover').style.display = 'none';
            isGameOver = false;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
