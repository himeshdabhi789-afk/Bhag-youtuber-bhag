<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Granny Day Action - Lights & Unique IDs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        * { user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #87CEEB; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        input, select, button {
            padding: 12px; margin: 8px; font-size: 16px; border-radius: 8px; border: none;
        }
        input, select { width: 280px; text-align: center; }
        button { background: #ff4500; color: white; font-weight: bold; cursor: pointer; }

        #ui {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            color: #000; font-size: 16px; font-weight: bold;
            text-shadow: 1px 1px 2px #fff; pointer-events: none;
        }

        #actionBtn {
            position: absolute; bottom: 30px; right: 30px;
            width: 80px; height: 80px; background: #ff3300; color: white;
            border-radius: 50%; border: 3px solid #fff; font-weight: bold;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
            z-index: 30; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #joystickZone {
            position: absolute; bottom: 20px; left: 20px;
            width: 120px; height: 120px; z-index: 20;
        }

        #idDisplayBox {
            background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px;
            margin-top: 10px; border: 1px solid #00ff00; text-align: center;
        }
    </style>
</head>
<body>

<div id="lobby">
    <h2 style="color: #ffd700; margin-bottom: 10px;">☀️ દિવસનો પ્રકાશ & લાઈટ 3D ગ્રેની ગેમ ☀️</h2>
    <input type="text" id="playerName" placeholder="તમારું નામ (Player Name)">
    <input type="text" id="targetPeerId" placeholder="ફ્રેન્ડની આઈડી નાખો (જોઈન થવા)">
    
    <label style="color:#aaa; font-size:14px; margin-top:5px;">મિત્રોની સંખ્યા:</label>
    <select id="maxPlayers">
        <option value="3">૩ મિત્રો</option>
        <option value="6">૬ મિત્રો</option>
        <option value="9" selected>૯ મિત્રો (Max)</option>
    </select>

    <button onclick="startHost()">૧. રૂમ બનાવો (Host)</button>
    <button onclick="connectPeer()">૨. ફ્રેન્ડ સાથે જોડાઓ (Join)</button>
    
    <div id="idDisplayBox">
        <p style="color: #aaa; font-size: 13px;">તમારી યુનિક આઈડી (આ ફ્રેન્ડને આપો):</p>
        <span id="myIdText" style="color: #00ff00; font-size: 18px; font-weight: bold;">હજુ બની નથી...</span>
    </div>
</div>

<div id="ui">
    🔑 ચાવીઓ: <span id="keyCount">0</span> / 20 | 🔫 ગન: <span id="gunStatus">નથી</span>
    <br><span id="status" style="color:#008000;"></span>
</div>

<div id="joystickZone"></div>
<button id="actionBtn" onclick="fireAction()">ફાયર!</button>

<script>
let peer, conn = [];
let myPlayerName = "";
let myUniqueId = "";
let isHost = false;
let myPlayerMesh;
let otherPlayers = {};
let playerColors = [0xff0000, 0x0000ff, 0xff00ff, 0xffff00, 0xff8000, 0x0080ff, 0xff0080, 0x80ff00, 0x00ff80];

function initPeer(callback) {
    let inputName = document.getElementById("playerName").value.trim() || "Player";
    // દરેક પ્લેયર માટે તદ્દન અલગ અને યુનિક આઈડી બનાવવા માટે રેન્ડમ નંબર જોડ્યો છે
    myUniqueId = inputName + "_" + Math.floor(1000 + Math.random() * 9000);
    
    peer = new Peer(myUniqueId);
    peer.on('open', (id) => {
        myUniqueId = id;
        document.getElementById("myIdText").innerText = id;
        if(callback) callback();
    });
    peer.on('error', (err) => {
        alert("આઈડી બનાવવામાં ભૂલ આવી, બીજું નામ ટ્રાય કરો.");
    });
    peer.on('connection', (c) => {
        conn.push(c);
        setupConnection(c);
    });
}

function startHost() {
    initPeer(() => {
        isHost = true;
        document.getElementById("lobby").style.display = "none";
        init3DGame();
    });
}

function connectPeer() {
    initPeer(() => {
        isHost = false;
        let target = document.getElementById("targetPeerId").value.trim();
        if(!target) {
            alert("કૃપા કરીને ફ્રેન્ડની આઈડી નાખો!");
            return;
        }
        let c = peer.connect(target);
        conn.push(c);
        setupConnection(c);
        document.getElementById("lobby").style.display = "none";
        init3DGame();
    });
}

function setupConnection(c) {
    document.getElementById("status").innerText = "સફળતાપૂર્વક કનેક્ટ થઈ ગયું!";
    c.on('data', (data) => {
        if (!otherPlayers[data.id]) {
            const pGeo = new THREE.BoxGeometry(1.2, 2, 1.2);
            let mesh = new THREE.Mesh(pGeo, new THREE.MeshStandardMaterial({ color: data.color }));
            mesh.position.set(data.x, data.y, data.z);
            scene.add(mesh);
            otherPlayers[data.id] = mesh;
        } else {
            otherPlayers[data.id].position.set(data.x, data.y, data.z);
        }
    });
}

// --- THREE.JS 3D ENGINE (Daylight & Indoor Lights) ---
let scene, camera, renderer;
let moveVector = { x: 0, y: 0 };
let keysCollected = 0;
let keysArray = [];
let gunsArray = [];
let hasGun = false;
let escapePoints = [];

let isDragging = false;
let previousTouch = { x: 0, y: 0 };
let cameraAngleX = 0;
let cameraAngleY = 0.4;

function init3DGame() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // ખુલ્લું આકાશ (Daylight background)

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // દિવસનો સૂર્ય પ્રકાશ (Bright Sunlight)
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(30, 50, 30);
    sunLight.castShadow = true;
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    // ** ઘરની અંદર લાઈટ્સ (Indoor Lights / Bulbs) **
    const light1 = new THREE.PointLight(0xfffaed, 2, 35);
    light1.position.set(0, 5, 0);
    scene.add(light1);

    const light2 = new THREE.PointLight(0xfffaed, 1.5, 25);
    light2.position.set(-15, 5, -15);
    scene.add(light2);

    const light3 = new THREE.PointLight(0xfffaed, 1.5, 25);
    light3.position.set(15, 5, 15);
    scene.add(light3);

    // જમીન
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshStandardMaterial({ color: 0xdeb887 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ઘરની દીવાલો
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
    createWall(0, 3, -30, 60, 6, 1, wallMat);
    createWall(0, 3, 30, 60, 6, 1, wallMat);
    createWall(-30, 3, 0, 1, 6, 60, wallMat);
    createWall(30, 3, 0, 1, 6, 60, wallMat);

    // ગ્રેની બોસ હેડ
    let grannyHead = new THREE.Mesh(
        new THREE.SphereGeometry(2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3 })
    );
    grannyHead.position.set(0, 2, 0);
    scene.add(grannyHead);

    // એસ્કેપ પોઈન્ટ્સ
    let mainDoor = createCustomObject(0, 2, -29, 4, 4, 0.5, 0x8B4513, "મેઈન ગેટ");
    let bus = createCustomObject(0, 1.5, 29, 4, 3, 6, 0x0000ff, "બસ");
    let train = createCustomObject(-29, 1.5, 0, 6, 3, 4, 0x808080, "ટ્રેન");
    let chopper = createCustomObject(29, 2, 0, 5, 2, 5, 0x00ff00, "હેલિકોપ્ટર");
    let boat = createCustomObject(-20, 0.5, -20, 3, 1, 5, 0x5c4033, "બોટ");
    escapePoints = [mainDoor, bus, train, chopper, boat];

    // ૩ ગ્રેની ગન
    let gunMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 });
    let gunPositions = [{x: 12, z: 12}, {x: -12, z: 12}, {x: 0, z: -18}];
    gunPositions.forEach(gp => {
        let gun = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 0.4), gunMat);
        gun.position.set(gp.x, 0.5, gp.z);
        scene.add(gun);
        gunsArray.push(gun);
    });

    // ૨૦ ચાવીઓ
    const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.5 });
    for (let i = 0; i < 20; i++) {
        let k = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), keyMat);
        k.position.set((Math.random() - 0.5) * 45, 0.5, (Math.random() - 0.5) * 45);
        scene.add(k);
        keysArray.push(k);
    }

    // પ્લેયર
    let myColor = playerColors[Math.floor(Math.random() * playerColors.length)];
    myPlayerMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2, 1.2),
        new THREE.MeshStandardMaterial({ color: myColor })
    );
    myPlayerMesh.position.set(5, 1, 5);
    myPlayerMesh.castShadow = true;
    scene.add(myPlayerMesh);

    setupJoystick();
    setupFreeLookControls();
    animate();
}

function createWall(x, y, z, w, h, d, mat) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    wall.position.set(x, y, z);
    wall.castShadow = true;
    wall.receiveShadow = true;
    scene.add(wall);
}

function createCustomObject(x, y, z, w, h, d, color, name) {
    let obj = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: color })
    );
    obj.position.set(x, y, z);
    obj.castShadow = true;
    obj.userData = { name: name };
    scene.add(obj);
    return obj;
}

function fireAction() {
    if (hasGun) {
        alert("💥 પ્લેયરે ગનથી ફાયર કર્યું!");
    } else {
        alert("⚠️ પહેલા મેપમાંથી ગ્રેનીની ગન શોધીને ઉઠાવો!");
    }
}

// સ્ક્રીન ફ્રી રોટેશન કંટ્રોલ્સ (બધી બાજુ સ્ક્રીન ફેરવી શકાશે)
function setupFreeLookControls() {
    window.addEventListener('touchstart', (e) => {
        isDragging = true;
        previousTouch.x = e.touches[0].clientX;
        previousTouch.y = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let touch = e.touches[0];
        cameraAngleX -= (touch.clientX - previousTouch.x) * 0.008;
        cameraAngleY += (touch.clientY - previousTouch.y) * 0.008;
        cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.2, cameraAngleY));
        previousTouch.x = touch.clientX;
        previousTouch.y = touch.clientY;
    });
    window.addEventListener('touchend', () => { isDragging = false; });
}

function setupJoystick() {
    const joystick = nipplejs.create({
        zone: document.getElementById('joystickZone'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white',
        size: 100
    });
    joystick.on('move', (evt, data) => {
        if (data.vector) { moveVector.x = data.vector.x; moveVector.y = data.vector.y; }
    });
    joystick.on('end', () => { moveVector.x = 0; moveVector.y = 0; });
}

function animate() {
    requestAnimationFrame(animate);

    let speed = 0.16;
    if (moveVector.x !== 0 || moveVector.y !== 0) {
        let newX = myPlayerMesh.position.x + moveVector.x * speed;
        let newZ = myPlayerMesh.position.z - moveVector.y * speed;
        if (Math.abs(newX) < 28.5) myPlayerMesh.position.x = newX;
        if (Math.abs(newZ) < 28.5) myPlayerMesh.position.z = newZ;
    }

    // ગન કલેક્ટ
    gunsArray.forEach((g) => {
        if (g.visible && myPlayerMesh.position.distanceTo(g.position) < 1.5) {
            g.visible = false;
            hasGun = true;
            document.getElementById("gunStatus").innerText = "હા (Ready)";
            alert("🔫 તમને ગ્રેનીની ગન મળી ગઈ!");
        }
    });

    // ચાવી કલેક્ટ
    keysArray.forEach((k) => {
        if (k.visible && myPlayerMesh.position.distanceTo(k.position) < 1.5) {
            k.visible = false;
            keysCollected++;
            document.getElementById("keyCount").innerText = keysCollected;
        }
    });

    // એસ્કેપ ચેક
    if (keysCollected >= 20) {
        escapePoints.forEach((ep) => {
            if (myPlayerMesh.position.distanceTo(ep.position) < 3.0) {
                alert("🎉 અભિનંદન! તમે " + ep.userData.name + " દ્વારા સફળતાપૂર્વક એસ્કેપ કરી લીધું!");
                location.reload();
            }
        });
    }

    // કેમેરા પોઝિશન અને રોટેશન
    let camDistance = 12;
    camera.position.x = myPlayerMesh.position.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
    camera.position.y = myPlayerMesh.position.y + camDistance * Math.sin(cameraAngleY);
    camera.position.z = myPlayerMesh.position.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
    camera.lookAt(myPlayerMesh.position);

    // ડેટા સિંક (દરેક ફ્રેન્ડની યુનિક આઈડી સાથે)
    conn.forEach(c => {
        if (c && c.open) {
            c.send({
                id: myUniqueId,
                x: myPlayerMesh.position.x,
                y: myPlayerMesh.position.y,
                z: myPlayerMesh.position.z,
                color: myPlayerMesh.material.color.getHex()
            });
        }
    });

    renderer.render(scene, camera);
}
</script>
</body>
</html>
