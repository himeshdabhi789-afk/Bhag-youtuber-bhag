<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ભાગ યુટ્યુબર ભાગ - Joystick Mode</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #111; font-size: 22px; font-weight: bold; z-index: 10; background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 8px; }
        #gameover { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; font-size: 40px; text-align: center; font-weight: bold; z-index: 10; text-shadow: 2px 2px 8px #fff; }
        
        /* Joystick Controls UI */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 10; }
        .btn { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.6); border: 3px solid #111; border-radius: 50%; font-size: 30px; font-weight: bold; color: #111; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(0, 0, 0, 0.4); color: #fff; }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="gameover">GAME OVER!<br><span style="font-size: 20px; color: #111;">Tap Screen or Press Space to Restart</span></div>

    <!-- Screen Joystick Controls -->
    <div class="controls">
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <script>
        let scene, camera, renderer, player, obstacles = [], score = 0, isGameOver = false;
        let lanes = [-2, 0, 2];
        let currentLane = 1;

        function init() {
            // Day Sky Color
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Sunlight & Ambient Lighting
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(10, 20, 10);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Green Fields
            const grassGeometry = new THREE.PlaneGeometry(100, 100);
            const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4CA64C });
            const grass = new THREE.Mesh(grassGeometry, grassMaterial);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = -0.01;
            scene.add(grass);

            // Road Track
            const roadGeometry = new THREE.PlaneGeometry(7, 100);
            const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -40;
            scene.add(road);

            // 3D Player Cube
            const playerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x0055FF });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(lanes[currentLane], 0.4, 0);
            scene.add(player);

            // Event Listeners for Keyboard Controls
            window.addEventListener('keydown', handleInput);
            window.addEventListener('resize', onWindowResize);

            // Touch / Click Events for Joystick Buttons
            document.getElementById('leftBtn').addEventListener('pointerdown', moveLeft);
            document.getElementById('rightBtn').addEventListener('pointerdown', moveRight);
            window.addEventListener('pointerdown', () => { if (isGameOver) restartGame(); });

            animate();
        }

        function moveLeft() {
            if (!isGameOver && currentLane > 0) {
                currentLane--;
                player.position.x = lanes[currentLane];
            }
        }

        function moveRight() {
            if (!isGameOver && currentLane < 2) {
                currentLane++;
                player.position.x = lanes[currentLane];
            }
        }

        function handleInput(e) {
            if (isGameOver && e.code === 'Space') {
                restartGame();
                return;
            }
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
        }

        function spawnObstacle() {
            if (isGameOver) return;
            const lane = lanes[Math.floor(Math.random() * 3)];
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshLambertMaterial({ color: 0xE63946 });
            const obstacle = new THREE.Mesh(geo, mat);
            obstacle.position.set(lane, 0.5, -50);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        setInterval(spawnObstacle, 1100);

        function animate() {
            if (!isGameOver) {
                requestAnimationFrame(animate);

                for (let i = 0; i < obstacles.length; i++) {
                    obstacles[i].position.z += 0.35;

                    // Collision Detection
                    if (Math.abs(obstacles[i].position.z - player.position.z) < 0.7 &&
                        Math.abs(obstacles[i].position.x - player.position.x) < 0.7) {
                        endGame();
                    }

                    if (obstacles[i].position.z > 5) {
                        scene.remove(obstacles[i]);
                        obstacles.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                    }
                }
                renderer.render(scene, camera);
            }
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('gameover').style.display = 'block';
        }

        function restartGame() {
            obstacles.forEach(obj => scene.remove(obj));
            obstacles = [];
            score = 0;
            currentLane = 1;
            player.position.x = lanes[currentLane];
            document.getElementById('score').innerText = score;
            document.getElementById('gameover').style.display = 'none';
            isGameOver = false;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
